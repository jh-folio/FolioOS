# 웹 검색으로 가져올 수 있는 출처.
#
# 웹 검색은 로컬 자료를 대체하지 않고 부족한 자리만 채운다(원칙 9). 그런데 로컬
# 자료에는 출처 우선순위를 엄격히 매기면서 웹에는 아무 계층도 두지 않으면, 가장
# 약한 자료가 가장 느슨하게 들어온다. 이 파일이 그 계층이다.
#
# 등급은 둘이다.
#   official  공시·통계·중앙은행처럼 1차 자료. 회사 공식 도메인도 여기에 들어간다.
#   media     신뢰 가능한 금융 매체. 유료 매체도 포함하되 유료 본문은 가져오지 않는다.
#             검색 결과의 제목·요약과 공개 페이지까지만 쓴다(원칙 4).
#
# 목록에 없는 도메인은 근거로 쓰지 않는다. 코드를 고치지 않고 여기서 넣고 뺀다.

official:
