# 회사 공식 도메인은 목록에 두지 않는다. 1만 종목의 IR 주소를 손으로 관리할 수 없고,
# yfinance가 회사 웹사이트를 준다(NVDA→nvidia.com, 삼성전자→samsung.com). 해석된
# 회사의 도메인만 그 회사 분석에서 official 등급으로 허용한다.
# 도출이 틀리는 예외만 여기에 적는다.
company_domain_overrides: {}
